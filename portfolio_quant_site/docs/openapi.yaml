openapi: 3.1.0
info:
  title: Quantitative Portfolio Management System (QPMS) API
  version: 1.0.0
  description: >
    REST API for the Quantitative Portfolio Management System.
    Covers users, stocks (Yahoo-enriched master data), portfolios, holdings,
    stock prices, transactions, portfolio analytics, factor sorting and
    asset-allocation optimizers. Money values use fixed-precision decimals
    (never floats). Single-user, no authentication.
  contact:
    name: QPMS
  license:
    name: MIT

servers:
  - url: http://localhost:8000
    description: Local development

tags:
  - name: Users
    description: Single-user account and cash balance.
  - name: Stocks
    description: Master instrument data and price history.
  - name: Portfolios
    description: Portfolio containers for a user.
  - name: Holdings
    description: Current positions (browse / buy / sell).
  - name: Transactions
    description: Immutable history of buys, sells and cash moves.
  - name: Analytics
    description: Profit & loss analytics (single stock and portfolio-level).
  - name: Factors
    description: Cross-sectional factor screening and sorting.
  - name: Optimize
    description: Asset allocation optimizers (CAPM, MVO, Black-Litterman).

paths:
  # ============================================================
  # USERS
  # ============================================================
  /api/v1/users/{userId}:
    get:
      tags: [Users]
      summary: Get the user (name + cash balance)
      operationId: getUser
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================
  # STOCKS
  # ============================================================
  /api/v1/stocks:
    get:
      tags: [Stocks]
      summary: List known stocks (name and/or symbol)
      operationId: listStocks
      parameters:
        - name: search
          in: query
          description: Filter by symbol or name substring.
          schema:
            type: string
        - name: sector
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A page of stocks.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StockSummary'

  /api/v1/stocks/{stockId}:
    get:
      tags: [Stocks]
      summary: Get full stock detail (sector, summary, market cap, ...)
      operationId: getStock
      parameters:
        - $ref: '#/components/parameters/StockId'
      responses:
        '200':
          description: Stock detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stock'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/stocks/{stockId}/prices:
    get:
      tags: [Stocks]
      summary: Price history (OHLC candles) for a stock
      description: >
        Returns candles for the requested interval, optionally bounded by a
        time frame. Used to render the price chart and to compute risk,
        volatility, returns, Sharpe ratio and drawdown.
      operationId: getStockPrices
      parameters:
        - $ref: '#/components/parameters/StockId'
        - name: interval
          in: query
          description: Candle interval (1d, 1h, 5m, ...).
          schema:
            type: string
            default: 1d
        - name: start
          in: query
          description: Inclusive start timestamp (ISO 8601).
          schema:
            type: string
            format: date-time
        - name: end
          in: query
          description: Inclusive end timestamp (ISO 8601).
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Candle series.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PriceCandle'

  /api/v1/stocks/{stockId}/quote:
    get:
      tags: [Stocks]
      summary: Latest live price for a stock
      operationId: getStockQuote
      parameters:
        - $ref: '#/components/parameters/StockId'
      responses:
        '200':
          description: Latest quote.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================
  # PORTFOLIOS
  # ============================================================
  /api/v1/portfolios:
    get:
      tags: [Portfolios]
      summary: List portfolios for the user
      operationId: listPortfolios
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Portfolios.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Portfolio'
    post:
      tags: [Portfolios]
      summary: Create a portfolio
      operationId: createPortfolio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortfolioCreate'
      responses:
        '201':
          description: Portfolio created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Portfolio'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/portfolios/{portfolioId}:
    get:
      tags: [Portfolios]
      summary: Get a portfolio
      operationId: getPortfolio
      parameters:
        - $ref: '#/components/parameters/PortfolioId'
      responses:
        '200':
          description: Portfolio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Portfolio'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Portfolios]
      summary: Delete a portfolio
      operationId: deletePortfolio
      parameters:
        - $ref: '#/components/parameters/PortfolioId'
      responses:
        '204':
          description: Deleted.
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================
  # HOLDINGS
  # ============================================================
  /api/v1/portfolios/{portfolioId}/holdings:
    get:
      tags: [Holdings]
      summary: Browse portfolio holdings (with live value)
      operationId: listHoldings
      parameters:
        - $ref: '#/components/parameters/PortfolioId'
      responses:
        '200':
          description: Current positions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Holding'
    post:
      tags: [Holdings]
      summary: Add / buy a stock into the portfolio
      description: >
        Buys quantity of a stock at a price. Debits the user cash balance,
        upserts the holding and records a BUY transaction.
      operationId: addHolding
      parameters:
        - $ref: '#/components/parameters/PortfolioId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HoldingBuy'
      responses:
        '201':
          description: Holding created/updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Holding'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/portfolios/{portfolioId}/holdings/{stockId}:
    delete:
      tags: [Holdings]
      summary: Remove / sell a stock from the portfolio
      description: >
        Sells the given quantity (or the whole position if omitted). Credits the
        user cash balance at the live/given price and records a SELL transaction.
      operationId: sellHolding
      parameters:
        - $ref: '#/components/parameters/PortfolioId'
        - $ref: '#/components/parameters/StockId'
        - name: quantity
          in: query
          description: Quantity to sell. Omit to sell the entire position.
          schema:
            type: number
        - name: price
          in: query
          description: Sell price per unit. Defaults to latest live price.
          schema:
            type: number
      responses:
        '200':
          description: Sale executed; returns resulting transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================
  # TRANSACTIONS
  # ============================================================
  /api/v1/portfolios/{portfolioId}/transactions:
    get:
      tags: [Transactions]
      summary: Transaction history for a portfolio
      operationId: listTransactions
      parameters:
        - $ref: '#/components/parameters/PortfolioId'
        - name: transType
          in: query
          schema:
            $ref: '#/components/schemas/TransType'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Transactions (newest first).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'

  # ============================================================
  # ANALYTICS
  # ============================================================
  /api/v1/stocks/{stockId}/pnl:
    get:
      tags: [Analytics]
      summary: Profit & loss for a single stock
      description: >
        Unrealized and realized P&L for a stock, aggregated over every holding
        across all portfolios. Realized P&L uses weighted-average cost
        accounting over the transaction history.
      operationId: getStockPnl
      parameters:
        - $ref: '#/components/parameters/StockId'
      responses:
        '200':
          description: Stock P&L.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockPnl'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/portfolios/{portfolioId}/pnl:
    get:
      tags: [Analytics]
      summary: Portfolio profit & loss with a per-holding breakdown
      description: >
        Sum of unrealized and realized P&L across a portfolio's stock holdings,
        with a per-holding breakdown. Realized P&L uses weighted-average cost
        accounting over the transaction history.
      operationId: getPortfolioPnl
      parameters:
        - $ref: '#/components/parameters/PortfolioId'
      responses:
        '200':
          description: Portfolio P&L.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioPnl'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/portfolios/{portfolioId}/allocation/by-quote-type:
    get:
      tags: [Analytics]
      summary: Portfolio allocation by quote_type (for a pie chart)
      description: >
        Counts the portfolio's holdings grouped by their stock's quote_type
        (e.g. EQUITY, ETF). Slice size = number of holdings; weight is that
        count divided by the total holding count.
      operationId: getAllocationByQuoteType
      parameters:
        - $ref: '#/components/parameters/PortfolioId'
      responses:
        '200':
          description: Allocation by quote_type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllocationInsight'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/portfolios/{portfolioId}/allocation/by-sector:
    get:
      tags: [Analytics]
      summary: Portfolio allocation by sector (for a pie chart)
      description: >
        Counts the portfolio's holdings grouped by their stock's sector. Slice
        size = number of holdings; weight is that count divided by the total
        holding count.
      operationId: getAllocationBySector
      parameters:
        - $ref: '#/components/parameters/PortfolioId'
      responses:
        '200':
          description: Allocation by sector.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllocationInsight'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/portfolios/performers:
    get:
      tags: [Analytics]
      summary: Top & worst current holding for each of a user's portfolios
      description: >
        For every portfolio of the user, ranks the current holdings by a P&L
        metric (total_pnl_pct, total_pnl or unrealized_pnl_pct) and returns the
        best and worst holding. Holdings without a price for the metric are
        excluded from ranking; an empty/unranked portfolio yields nulls.
      operationId: getPortfoliosPerformers
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: integer
            format: int64
        - name: metric
          in: query
          schema:
            type: string
            enum: [total_pnl_pct, total_pnl, unrealized_pnl_pct]
            default: total_pnl_pct
      responses:
        '200':
          description: Per-portfolio performers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerformersResponse'

  /api/v1/portfolios/risk:
    get:
      tags: [Analytics]
      summary: Risk metrics for each of a user's portfolios
      description: >
        For every portfolio of the user, evaluates the risk of its current
        holdings weighted by market value. Portfolio daily returns are the
        weighted sum of each holding's adjusted-close daily returns over the
        lookback window, then annualized (volatility and return), Sharpe ratio,
        max drawdown and historical Value-at-Risk (95%/99%) are computed, plus
        beta against the benchmark. Formulas follow docs/MATH_SPECS.md.
      operationId: getPortfoliosRisk
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: integer
            format: int64
        - name: lookbackDays
          in: query
          schema:
            type: integer
            default: 252
            minimum: 30
            maximum: 2520
        - name: riskFreeRate
          in: query
          schema:
            type: number
            default: 0.0
        - name: benchmarkSymbol
          in: query
          schema:
            type: string
            default: SPY
      responses:
        '200':
          description: Per-portfolio risk metrics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfoliosRiskResponse'

  # ============================================================
  # FACTORS
  # ============================================================
  /api/v1/factors/sort:
    post:
      tags: [Factors]
      summary: Univariate / bivariate cross-sectional factor sort
      description: >
        Ranks the stock universe into deciles/quantiles on one or two style
        factors and returns the selected high-exposure subset.
      operationId: sortFactors
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FactorSortRequest'
      responses:
        '200':
          description: Selected securities with bin rankings.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FactorSortRow'
        '400':
          $ref: '#/components/responses/BadRequest'

  # ============================================================
  # OPTIMIZE
  # ============================================================
  /api/v1/optimize/mvo:
    post:
      tags: [Optimize]
      summary: Mean-Variance Optimization (max Sharpe weights)
      operationId: optimizeMvo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MvoRequest'
      responses:
        '200':
          description: Optimal weights.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllocationResult'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/optimize/black-litterman:
    post:
      tags: [Optimize]
      summary: Black-Litterman posterior returns & optimal weights
      operationId: optimizeBlackLitterman
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlackLittermanRequest'
      responses:
        '200':
          description: Posterior returns and allocation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlackLittermanResult'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/optimize/capm:
    post:
      tags: [Optimize]
      summary: CAPM expected return
      operationId: optimizeCapm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapmRequest'
      responses:
        '200':
          description: Expected return.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapmResult'
        '400':
          $ref: '#/components/responses/BadRequest'

# ================================================================
# COMPONENTS
# ================================================================
components:
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    StockId:
      name: stockId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    PortfolioId:
      name: portfolioId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 500
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        default: 0
        minimum: 0

  responses:
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      properties:
        detail:
          type: string
      required: [detail]

    # ---------- Core entities ----------
    User:
      type: object
      properties:
        user_id:
          type: integer
          format: int64
        user_name:
          type: string
        email:
          type: string
          format: email
          nullable: true
        acct_balance:
          type: string
          description: Decimal string (NUMERIC 18,2).
          example: "10000.00"
        created_at:
          type: string
          format: date-time
      required: [user_id, user_name, acct_balance]

    StockSummary:
      type: object
      properties:
        stock_id:
          type: integer
          format: int64
        symbol:
          type: string
        short_name:
          type: string
          nullable: true
        sector:
          type: string
          nullable: true
      required: [stock_id, symbol]

    Stock:
      allOf:
        - $ref: '#/components/schemas/StockSummary'
        - type: object
          properties:
            exchange:
              type: string
              nullable: true
            quote_type:
              type: string
              nullable: true
            long_name:
              type: string
              nullable: true
            currency:
              type: string
              nullable: true
            country:
              type: string
              nullable: true
            industry:
              type: string
              nullable: true
            website:
              type: string
              nullable: true
            business_summary:
              type: string
              nullable: true
            market_cap:
              type: integer
              format: int64
              nullable: true
            shares_outstanding:
              type: integer
              format: int64
              nullable: true
            first_seen_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time

    PriceCandle:
      type: object
      properties:
        ts:
          type: string
          format: date-time
        interval:
          type: string
        open:
          type: string
        high:
          type: string
        low:
          type: string
        close:
          type: string
        adj_close:
          type: string
          nullable: true
        volume:
          type: integer
          format: int64
          nullable: true
        dividend:
          type: string
          nullable: true
        stock_split:
          type: string
          nullable: true
      required: [ts, interval, open, high, low, close]

    Quote:
      type: object
      properties:
        stock_id:
          type: integer
          format: int64
        symbol:
          type: string
        price:
          type: string
        ts:
          type: string
          format: date-time
      required: [stock_id, symbol, price, ts]

    Portfolio:
      type: object
      properties:
        portfolio_id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
        name:
          type: string
        created_at:
          type: string
          format: date-time
      required: [portfolio_id, user_id, name]

    PortfolioCreate:
      type: object
      properties:
        user_id:
          type: integer
          format: int64
        name:
          type: string
          default: My Portfolio
      required: [user_id]

    Holding:
      type: object
      properties:
        portfolio_id:
          type: integer
          format: int64
        stock_id:
          type: integer
          format: int64
        symbol:
          type: string
        short_name:
          type: string
          nullable: true
        quantity:
          type: string
        avg_buy_price:
          type: string
          nullable: true
        price_live:
          type: string
          nullable: true
        market_value:
          type: string
          nullable: true
        updated_at:
          type: string
          format: date-time
      required: [portfolio_id, stock_id, symbol, quantity]

    HoldingBuy:
      type: object
      properties:
        symbol:
          type: string
          example: AAPL
        quantity:
          type: number
          example: 10
        price:
          type: number
          description: Buy price per unit. Defaults to latest live price if omitted.
          example: 192.35
      required: [symbol, quantity]

    TransType:
      type: string
      enum: [BUY, SELL, DEPOSIT, WITHDRAW, DIVIDEND]

    Transaction:
      type: object
      properties:
        trans_id:
          type: integer
          format: int64
        portfolio_id:
          type: integer
          format: int64
        stock_id:
          type: integer
          format: int64
          nullable: true
        trans_type:
          $ref: '#/components/schemas/TransType'
        quantity:
          type: string
          nullable: true
        price:
          type: string
          nullable: true
        amount:
          type: string
          nullable: true
        trans_details:
          type: string
          nullable: true
        ts:
          type: string
          format: date-time
      required: [trans_id, portfolio_id, trans_type, ts]

    # ---------- Analytics ----------
    StockPnl:
      type: object
      description: Profit & loss for a single stock position or aggregate.
      properties:
        stock_id:
          type: integer
        symbol:
          type: string
        short_name:
          type: string
          nullable: true
        portfolio_id:
          type: integer
          nullable: true
          description: Set for a portfolio-holding row; null for the stock-level aggregate.
        quantity:
          type: string
        avg_buy_price:
          type: string
          nullable: true
        current_price:
          type: string
          nullable: true
        cost_basis:
          type: string
        market_value:
          type: string
          nullable: true
        unrealized_pnl:
          type: string
          nullable: true
        unrealized_pnl_pct:
          type: number
          nullable: true
        realized_pnl:
          type: string
        invested:
          type: string
        total_pnl:
          type: string
          nullable: true
        total_pnl_pct:
          type: number
          nullable: true
      required: [stock_id, symbol, quantity, cost_basis, realized_pnl, invested]

    PortfolioPnl:
      type: object
      description: Portfolio-wide P&L summary with a per-holding breakdown.
      properties:
        portfolio_id:
          type: integer
        holdings_count:
          type: integer
        total_cost_basis:
          type: string
        total_market_value:
          type: string
          nullable: true
        total_unrealized_pnl:
          type: string
          nullable: true
        total_unrealized_pnl_pct:
          type: number
          nullable: true
        total_realized_pnl:
          type: string
        total_pnl:
          type: string
          nullable: true
        total_pnl_pct:
          type: number
          nullable: true
        total_invested:
          type: string
        holdings:
          type: array
          items:
            $ref: '#/components/schemas/StockPnl'
      required: [portfolio_id, holdings_count, total_cost_basis, total_realized_pnl, total_invested, holdings]

    AllocationGroup:
      type: object
      description: "A single pie-chart slice: holdings count per sector / quote_type."
      properties:
        label:
          type: string
        holdings_count:
          type: integer
        weight:
          type: number
          description: holdings_count divided by total_holdings.
      required: [label, holdings_count, weight]

    AllocationInsight:
      type: object
      description: Portfolio allocation by a stock attribute, for pie charts.
      properties:
        portfolio_id:
          type: integer
        grouping:
          type: string
          description: The stocks column grouped by (quote_type or sector).
        total_holdings:
          type: integer
        groups:
          type: array
          items:
            $ref: '#/components/schemas/AllocationGroup'
      required: [portfolio_id, grouping, total_holdings, groups]

    PortfolioPerformers:
      type: object
      description: Top and worst current holding of a portfolio, ranked by a P&L metric.
      properties:
        portfolio_id:
          type: integer
        name:
          type: string
          nullable: true
        holdings_count:
          type: integer
        metric:
          type: string
          description: The ranking field used (e.g. total_pnl_pct).
        top_performer:
          $ref: '#/components/schemas/StockPnl'
          nullable: true
        worst_performer:
          $ref: '#/components/schemas/StockPnl'
          nullable: true
      required: [portfolio_id, holdings_count, metric]

    PerformersResponse:
      type: object
      description: Top / worst performers across a user's portfolios.
      properties:
        portfolios:
          type: array
          items:
            $ref: '#/components/schemas/PortfolioPerformers'
      required: [portfolios]

    RiskMetrics:
      type: object
      description: >
        Statistical risk metrics for a return series. Percent values are
        decimals (0.2 = 20%); drawdown and VaR are expressed as positive/negative
        per their sign conventions.
      properties:
        annualized_return:
          type: number
          nullable: true
        annualized_volatility:
          type: number
          nullable: true
        sharpe_ratio:
          type: number
          nullable: true
        max_drawdown:
          type: number
          nullable: true
        value_at_risk_95:
          type: number
          nullable: true
        value_at_risk_99:
          type: number
          nullable: true
        beta:
          type: number
          nullable: true

    PortfolioRisk:
      type: object
      description: Risk evaluation for a portfolio's current holdings.
      properties:
        portfolio_id:
          type: integer
        name:
          type: string
          nullable: true
        weights_count:
          type: integer
          description: Number of holdings with price data used in the weights.
        observations:
          type: integer
          description: Number of daily returns in the sample window.
        window_start:
          type: string
          format: date-time
          nullable: true
        window_end:
          type: string
          format: date-time
          nullable: true
        risk_free_rate:
          type: number
        benchmark:
          type: string
          nullable: true
        metrics:
          $ref: '#/components/schemas/RiskMetrics'
        benchmark_metrics:
          $ref: '#/components/schemas/RiskMetrics'
          nullable: true
      required: [portfolio_id, weights_count, observations, risk_free_rate, metrics]

    PortfoliosRiskResponse:
      type: object
      description: Risk evaluation across a user's portfolios.
      properties:
        portfolios:
          type: array
          items:
            $ref: '#/components/schemas/PortfolioRisk'
      required: [portfolios]

    # ---------- Factors ----------
    FactorName:
      type: string
      enum: [MKT, SMB, HML, RMW, CMA, MOM]

    FactorSortRequest:
      type: object
      properties:
        mode:
          type: string
          enum: [univariate, bivariate]
          default: univariate
        factor_a:
          $ref: '#/components/schemas/FactorName'
        factor_b:
          $ref: '#/components/schemas/FactorName'
          nullable: true
        num_deciles:
          type: integer
          default: 10
        target_threshold:
          type: integer
          description: Lowest decile index to include (e.g. 7 = top 3 deciles).
          default: 7
        bins_a:
          type: integer
          default: 3
        bins_b:
          type: integer
          default: 3
      required: [mode, factor_a]

    FactorSortRow:
      type: object
      properties:
        stock_id:
          type: integer
          format: int64
        symbol:
          type: string
        short_name:
          type: string
          nullable: true
        sector:
          type: string
          nullable: true
        market_cap:
          type: integer
          format: int64
          nullable: true
        factor_a_value:
          type: number
        factor_b_value:
          type: number
          nullable: true
        bin_factor_a:
          type: integer
          nullable: true
        bin_factor_b:
          type: integer
          nullable: true
      required: [stock_id, symbol]

    # ---------- Optimizers ----------
    AllocationResult:
      type: object
      properties:
        symbols:
          type: array
          items:
            type: string
        weights:
          type: array
          items:
            type: number
        expected_return:
          type: number
          nullable: true
        expected_volatility:
          type: number
          nullable: true
        sharpe_ratio:
          type: number
          nullable: true
      required: [symbols, weights]

    MvoRequest:
      type: object
      properties:
        symbols:
          type: array
          items:
            type: string
        risk_free_rate:
          type: number
          default: 0.0
        lookback_days:
          type: integer
          default: 252
      required: [symbols]

    View:
      type: object
      description: A single Black-Litterman subjective view.
      properties:
        assets:
          type: array
          items:
            type: string
          description: Assets referenced by this view (maps to a row of P).
        weights:
          type: array
          items:
            type: number
          description: Signed weights for the assets (row of P).
        expected_return:
          type: number
          description: Expected premium for the view (element of Q).
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: Confidence 0..1 mapping into the uncertainty matrix Omega.
      required: [assets, weights, expected_return]

    BlackLittermanRequest:
      type: object
      properties:
        symbols:
          type: array
          items:
            type: string
        risk_free_rate:
          type: number
          default: 0.0
        scaling_constant:
          type: number
          default: 0.05
        views:
          type: array
          items:
            $ref: '#/components/schemas/View'
      required: [symbols]

    BlackLittermanResult:
      allOf:
        - $ref: '#/components/schemas/AllocationResult'
        - type: object
          properties:
            posterior_returns:
              type: array
              items:
                type: number

    CapmRequest:
      type: object
      properties:
        risk_free_rate:
          type: number
        portfolio_beta:
          type: number
        expected_market_return:
          type: number
      required: [risk_free_rate, portfolio_beta, expected_market_return]

    CapmResult:
      type: object
      properties:
        expected_return:
          type: number
        market_risk_premium:
          type: number
      required: [expected_return]
